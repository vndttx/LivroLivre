<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LivroLivre - Painel do Projeto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background-color: #3498db;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #2c3e50;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Plataforma LivroLivre</h1>
    <p>Projeto de extensão acadêmica voltado para a facilitação de trocas e doações de livros de forma segura e automatizada.</p>
    
    <div class="btn-container">
        <a href="https://seu-link-da-aplicacao-online.com" target="_blank" class="btn btn-primary">Acessar Aplicação Online</a>
        <a href="https://github.com/vndttx/livrolivre" target="_blank" class="btn btn-secondary">Ver Repositório no GitHub</a>
    </div>
</div>

</body>
</html>
