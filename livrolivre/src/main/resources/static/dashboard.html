<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Usuario - LivroLivre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1 id="titulo-painel">Painel do Usuario</h1>
    <nav class="menu-principal">
        <a href="index.html" class="button">Pagina Inicial</a>
        <a href="catalogo.html" class="button">Ver Catalogo</a>
        <a href="carrinho.html" class="button">Ver Carrinho (<span id="contador-carrinho">0</span>)</a>
        <a href="#" id="btn-sair" class="btn-sair">Sair</a>
    </nav>

    <section>
        <h2>Ofertas Recebidas</h2>
        <table id="ofertas-tabela">
            <thead>
            <tr>
                <th>Usuário Solicitante</th>
                <th>Livro Solicitado</th>
                <th>Livro Oferecido</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>

    <section>
        <h2>Meus Livros Cadastrados</h2>
        <table id="tabela-meus-livros">
            <thead>
            <tr>
                <th>Titulo</th>
                <th>Autor</th>
                <th>Gênero</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>

    <section>
        <h2>Histórico de transações</h2>
        <table id="historico-tabela">
            <thead>
            <tr>
                <th>Tipo</th>
                <th>Livro Solicitado</th>
                <th>Livro Oferecido</th>
                <th>Dono Original</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>
</div>

<script src="js/dashboard.js"></script>

</html>
