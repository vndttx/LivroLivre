<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LivroLivre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h2>Login</h2>
    <form id="login-form">
        <label for="nome-usuario">Usuário:</label>
        <input type="text" id="nome-usuario" name="nomeUsuario" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="cadastroUsuario.html">Cadastre-se aqui</a></p>
</div>

<script src="js/login.js"></script>
</body>
</html>
