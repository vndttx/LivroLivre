<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - LivroLivre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h2>Cadastrar Usuário</h2>
    <form id="cadastro-form">
        <input type="text" id="nome-usuario" required placeholder="Nome">
        <input type="email" id="email" required placeholder="E-mail">
        <input type="password" id="senha" required placeholder="Senha">
        <button type="submit">Cadastrar</button>
    </form>
    <button type="submit">Cadastrar</button>


    <p>Já tem conta? <a href="login.html">Faça o login aqui</a></p>
</div>
<script src="js/cadastroUsuario.js"></script>
</body>
</html>
