<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carrinho - LivroLivre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>Meu Carrinho</h1>
    <nav class="menu-principal">
        <a href="index.html" class="button">Pagina Inicial</a>
        <a href="catalogo.html" class="button">Ver Catalogo</a>
        <a href="#" id="btn-sair" class="btn-sair">Sair</a>
    </nav>

    <section>
        <table id="carrinho-tabela">
            <thead>
            <tr>
                <th>Titulo</th>
                <th>Acoes</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>
</div>

<div id="modal-troca" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Oferecer Livro para Troca</h2>
        <p>Selecione um dos seus livros disponiveis para oferecer em troca de <strong id="titulo-livro-solicitado"></strong>:</p>
        <select id="select-meus-livros"></select>
        <button id="btn-confirmar-troca" class="button">Confirmar Proposta</button>
    </div>
</div>

<script src="js/utils.js"></script>
<script src="js/carrinho.js"></script>
</body>
</html>
