services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: livrolivre
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  app:
    build:
      context: ./livrolivre
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/livrolivre
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root